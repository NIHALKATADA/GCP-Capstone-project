<!DOCTYPE html>
<html>
<head>
    <style>
        body { padding: 30px; font-family: Arial; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 250px; padding: 6px; margin-top: 5px; }
        .error-message { color: red; font-size: 11px; height: 15px; display: block; }
    </style>
</head>
<body>
    <label>Password:</label>
    <input type="password" id="password" onkeyup="validatePassword()">
    <span id="passwordError" class="error-message"></span>
    <label>Email Address:</label>
    <input type="text" id="email" onkeyup="validateEmail()">
    <span id="emailError" class="error-message"></span>
    <button onclick="validateForm()">Submit</button>
    <script>
        var isPasswordValid = false;
        var isEmailValid = false;

        function validatePassword() {
            var value = document.getElementById('password').value;
            var errorSpan = document.getElementById('passwordError');
            var lower = false, upper = false, digit = false, special = false;
            var symbols = "!@#$%^&*";
            for (var i = 0; i < value.length; i++) {
                var ch = value[i];
                if (ch >= "a" && ch <= "z") lower = true;
                else if (ch >= "A" && ch <= "Z") upper = true;
                else if (ch >= "0" && ch <= "9") digit = true;
                else if (symbols.includes(ch)) special = true;
            }
            if (value.length === 0) { errorSpan.innerHTML = ""; isPasswordValid = false; }
            else if (value.length < 8) { errorSpan.innerHTML = "Needs 8+ chars."; isPasswordValid = false; }
            else if (lower === false) { errorSpan.innerHTML = "Needs lowercase."; isPasswordValid = false; }
            else if (upper === false) { errorSpan.innerHTML = "Needs uppercase."; isPasswordValid = false; }
            else if (digit === false) { errorSpan.innerHTML = "Needs a number."; isPasswordValid = false; }
            else if (special === false) { errorSpan.innerHTML = "Needs a symbol."; isPasswordValid = false; }
            else { errorSpan.innerHTML = ""; isPasswordValid = true; }
        }
        function validateEmail() {
            var value = document.getElementById('email').value;
            var errorSpan = document.getElementById('emailError');

            if (value.length === 0) { errorSpan.innerHTML = ""; isEmailValid = false; }
            else if (value.includes("@") === false) { errorSpan.innerHTML = "Missing @."; isEmailValid = false; }
            else if (value.includes(".") === false) { errorSpan.innerHTML = "Missing dot."; isEmailValid = false; }
            else { errorSpan.innerHTML = ""; isEmailValid = true; }
        }

        function validateForm() {
            validatePassword(); validateEmail();
            if (isPasswordValid && isEmailValid) alert("Success");
            else alert("Error");
        }
    </script>

</body>
</html>

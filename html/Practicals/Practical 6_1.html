<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: white; 
            display: flex; 
            justify-content: center; 
            padding-top: 50px;
        }

        .calculator-card {
            background-color: whitesmoke;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 { color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }

        .input-group { 
            display: flex;
            flex-direction: column;
            margin-bottom: 15px; 
        }
        
        .input-group label { margin-bottom: 5px; font-weight: bold; color: #444; }
        
        .input-group input { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: #0056b3; }
        #results { 
            margin-top: 20px; 
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-weight: bold; 
            text-align: center;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Grade Calculator</h2>
        <p>Enter marks for exactly 3 subjects</p>
        
        <div class="input-group">
            <label>C++:</label>
            <input type="number" id="mark1" placeholder="Out of 100">
        </div>
        
        <div class="input-group">
            <label>IWP:</label>
            <input type="number" id="mark2" placeholder="Out of 100">
        </div>
        
        <div class="input-group">
            <label>MATHS:</label>
            <input type="number" id="mark3" placeholder="Out of 100">
        </div>
        
        <button onclick="calculateFromForm()">Calculate Results</button>
        
        <div id="results" style="display: none;"></div>
    </div>

    <script>
        function calculateFromForm() {
            let text1 = document.getElementById('mark1').value;
            let text2 = document.getElementById('mark2').value;
            let text3 = document.getElementById('mark3').value;
            let num1 = parseFloat(text1);
            let num2 = parseFloat(text2);
            let num3 = parseFloat(text3);
            let total = num1 + num2 + num3;
            let percentage = total / 3;
            let grade = "";
            if (percentage >= 90) {
                grade = "A";
            } else if (percentage >= 80) {
                grade = "B";
            } else if (percentage >= 70) {
                grade = "C";
            } else if (percentage >= 60) {
                grade = "D";
            } else {
                grade = "F";
            }
            let finalMessage = "Total Marks: " + total + "<br>" + "Percentage: " + percentage.toFixed(1) + "% <br>" + "Grade: " + grade;
            let resultsBox = document.getElementById('results');
            resultsBox.innerHTML = finalMessage;
            resultsBox.style.display = "block"; 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Library</title>
    <style>
        body { font-family: Arial, sans-serif; 
            background: #f0f2f5; display: flex;
            justify-content: center; 
            padding-top: 40px; }
        .box { background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; }
        input { width: 90%; 
            padding: 10px; 
            margin: 5px 0 15px; 
            border: 1px solid #ccc; 
            border-radius: 4px; }
        button { width: 100%; 
            padding: 10px; 
            background: #007bff; color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; }
        button:hover { background: #0056b3; }
        #results { margin-top: 15px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Library</h2>
        <input type="text" id="t" placeholder="Title">
        <input type="text" id="a" placeholder="Author">
        <input type="text" id="s" placeholder="Status (e.g., Available)">
        <button onclick="save()">Save Book</button>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        
        <input type="text" id="search" placeholder="Search exact title...">
        <button onclick="find()">Search</button>
        <div id="results"></div>
    </div>

    <script>
        let library = [];

        function save() {
            let titleBox = document.getElementById('t');
            let authorBox = document.getElementById('a');
            let statusBox = document.getElementById('s');

            if (titleBox.value === "") {
                alert("Please enter a title!");
                return;
            }

            library.push({ title: titleBox.value, author: authorBox.value, status: statusBox.value });
            alert("Saved! Total books: " + library.length);

            // Clear the boxes in one line
            titleBox.value = ""; authorBox.value = ""; statusBox.value = "";
            document.getElementById('results').style.display = "none";
        }

        function find() {
            let term = document.getElementById('search').value;
            let res = document.getElementById('results');
            res.style.display = "block";

            if (term === "") {
                res.innerHTML = "Please type a title.";
                return;
            }

            for (let i = 0; i < library.length; i++) {
                if (term === library[i].title) {
                    res.innerHTML = "Found!<br>Title: " + library[i].title + "<br>Author: " + library[i].author + "<br>Status: " + library[i].status;
                    return; 
                }
            }
            res.innerHTML = "Sorry, book not found.";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .form-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .form-body {
            padding: 50px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.8);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-item input[type="radio"],
        .checkbox-item input[type="checkbox"] {
            width: auto;
            transform: scale(1.3);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: #48bb78;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .form-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>🎓 Student Admission Form</h1>
            <p>Academic Year 2026-2027 | Apply Now</p>
        </div>

        <form id="admissionForm" class="form-body" novalidate>
            <!-- Personal Information -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required 
                           pattern="[A-Za-z\s]{2,50}" 
                           title="Name should contain only letters and spaces (2-50 characters)"
                           placeholder="Enter your full name">
                    <div class="error-message" id="nameError">Please enter a valid name</div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="student@example.com">
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required 
                           pattern="[+]?[0-9]{10,12}"
                           placeholder="+91 9876543210">
                    <div class="error-message" id="phoneError">Please enter a valid phone number</div>
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth *</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required 
                           max="2010-01-01">
                    <div class="error-message" id="dobError">Must be at least 16 years old</div>
                </div>
            </div>

            <!-- Academic Information -->
            <div class="form-row">
                <div class="form-group">
                    <label for="course">Preferred Course *</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="btech-cs">B.Tech Computer Science</option>
                        <option value="btech-ai">B.Tech Artificial Intelligence</option>
                        <option value="bsc-maths">B.Sc Mathematics</option>
                        <option value="mtech">M.Tech Data Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="percentage">10th Percentage *</label>
                    <input type="number" id="percentage" name="percentage" required 
                           min="0" max="100" step="0.01"
                           placeholder="95.5">
                    <div class="error-message" id="percentageError">Percentage must be between 0-100</div>
                </div>
            </div>

            <!-- Gender & Category -->
            <div class="form-row">
                <div class="form-group full-width">
                    <label>Gender *</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">Male</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="female" name="gender" value="female" required>
                            <label for="female">Female</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="other" name="gender" value="other" required>
                            <label for="other">Other</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category *</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="general" name="category" value="general" required>
                            <label for="general">General</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="obc" name="category" value="obc" required>
                            <label for="obc">OBC</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="sc" name="category" value="sc" required>
                            <label for="sc">SC</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="st" name="category" value="st" required>
                            <label for="st">ST</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="entranceScore">Entrance Exam Score</label>
                    <input type="number" id="entranceScore" name="entranceScore" 
                           min="0" max="1000" step="0.5"
                           placeholder="JEE/GUJCET Score">
                </div>
            </div>

            <!-- Address & Additional Info -->
            <div class="form-group full-width">
                <label for="address">Permanent Address *</label>
                <textarea id="address" name="address" required 
                          placeholder="Enter your complete address including city, state, pincode"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="terms" name="terms" required>
                        I agree to the <strong>Terms & Conditions</strong> *
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Submit Application
            </button>

            <div class="success-message" id="successMessage">
                ✅ Application submitted successfully! You will receive a confirmation email shortly.
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('admissionForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        // Real-time validation
        form.addEventListener('input', function(e) {
            validateField(e.target);
        });

        // Custom validation for date of birth (minimum 16 years)
        document.getElementById('dateOfBirth').addEventListener('change', function() {
            const dob = new Date(this.value);
            const today = new Date();
            const age = today.getFullYear() - dob.getFullYear();
            const dobError = document.getElementById('dobError');
            
            if (age < 16) {
                this.setCustomValidity('You must be at least 16 years old');
                dobError.style.display = 'block';
                dobError.textContent = 'You must be at least 16 years old';
            } else {
                this.setCustomValidity('');
                dobError.style.display = 'none';
            }
        });

        // Percentage validation
        document.getElementById('percentage').addEventListener('input', function() {
            const percentageError = document.getElementById('percentageError');
            if (this.value < 0 || this.value > 100) {
                percentageError.style.display = 'block';
            } else {
                percentageError.style.display = 'none';
            }
        });

        function validateField(field) {
            const errorElement = document.getElementById(field.id + 'Error');
            if (errorElement) {
                if (field.validity.valid) {
                    errorElement.style.display = 'none';
                } else {
                    errorElement.style.display = 'block';
                }
            }
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if form is valid
            if (form.checkValidity()) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';
                
                // Simulate API call
                setTimeout(() => {
                    successMessage.style.display = 'block';
                    form.style.display = 'none';
                }, 1500);
            } else {
                // Show first invalid field
                const firstInvalid = form.querySelector(':invalid');
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstInvalid.focus();
                }
            }
        });

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 12) value = value.slice(0, 12);
            e.target.value = value;
        });
    </script>
</body>
</html>

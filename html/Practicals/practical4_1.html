<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Karnavati university</title>
  <style>
    body {
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px; 
      text-align: center;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .flex-item {
      flex: 1 1 100%; 
      box-sizing: border-box;
      text-align: center;
      background-color: #ffffff; 
      border-radius: 12px; 
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.1); 
      overflow: hidden; 
    }

    .flex-item img {
      width: 400px;
      height: 400px;    
      display: block;
    }

    .text-block {
      padding: 20px 15px; 
      font-family: sans-serif;
      font-weight: bold;
      color: #333;
    }
    @media (min-width: 600px) {
      .flex-item {
        flex: 1 1 calc(50% - 20px); 
      }
    }

    @media (min-width: 900px) {
      .flex-item {
        flex: 1 1 calc(33.333% - 20px); 
      } 
    }
  </style>
</head>
<body>
    <h1>
        Karnavati University
    </h1>

  <div class="flex-container">
    <div class="flex-item">
      <img src="Photo\IMG_0722.webp" alt="image 1">
      <div class="text-block">USL</div>
    </div>
    <div class="flex-item">
      <img src="Photo/karnavati-university-gandhinagar-277742.webp" alt="Placeholder 2">
      <div class="text-block">UIT</div>
    </div>
    <div class="flex-item">
      <img src="Photo/11740048946.jpg" alt="Placeholder 3">
      <div class="text-block">UIM</div>
    </div>
  </div>

</body>
</html>

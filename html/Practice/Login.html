<!DOCTYPE html>
<html>
<head>
    <style>
        body { padding: 30px; font-family: Arial; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 250px; padding: 8px; }
        .error-msg { color: red; font-size: 12px; }
    </style>
</head>
<body>

    <label>Password:</label>
    <input type="password" id="password" onkeyup="validatePassword()">
    <span id="passError" class="error-msg"></span>

    <label>Email Address:</label>
    <input type="text" id="email" onkeyup="validateEmail()">
    <span id="emailError" class="error-msg"></span>
    <br><br>
    <button onclick="validateForm()">Submit</button>

    <script>
        var pStatus = false;
        var eStatus = false;

        function validatePassword() {
            var v = document.getElementById('password').value;
            var s = document.getElementById('passError');
            var m = "8+ chars, Capital, Number, & Symbol required.";

            if (v.length > 0) {
                if (v.length >= 8) {
                    if (v !== v.toLowerCase()) {
                        if (/[0-9]/.test(v)) {
                            if (/[!@#$%^&*]/.test(v)) {
                                s.innerHTML = "";
                                pStatus = true;
                            } else { s.innerHTML = m; pStatus = false; }
                        } else { s.innerHTML = m; pStatus = false; }
                    } else { s.innerHTML = m; pStatus = false; }
                } else { s.innerHTML = m; pStatus = false; }
            } else { s.innerHTML = ""; pStatus = false; }
        }

        function validateEmail() {
            var v = document.getElementById('email').value;
            var s = document.getElementById('emailError');
            if (v.length > 0) {
                if (v.includes("@")) {
                    if (v.includes(".")) {
                        s.innerHTML = "";
                        eStatus = true;
                    } else { s.innerHTML = "Invalid email format."; eStatus = false; }
                } else { s.innerHTML = "Invalid email format."; eStatus = false; }
            } else { s.innerHTML = ""; eStatus = false; }
        }

        function validateForm() {
            validatePassword();
            validateEmail();
            if (pStatus && eStatus) alert("Success");
            else alert("Error");
        }
    </script>

</body>
</html>

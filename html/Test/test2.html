<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admission Form</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#4facfe;padding:20px}
        .form{max-width:600px;margin:auto;background:white;padding:30px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
        h1{text-align:center;color:#333;margin-bottom:30px;background:#667eea;color:white;padding:20px;border-radius:10px}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        label{display:block;margin-bottom:5px;font-weight:bold}
        input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px}
        .full{width:100%}
        button{width:100%;padding:15px;background:#667eea;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer}
        @media(max-width:600px){.row{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="form">
        <h1>Student Admission</h1>
        <form>
            <div class="row">
                <div>
                    <label>Name *</label>
                    <input type="text" required>
                </div>
                <div>
                    <label>Email *</label>
                    <input type="email" required>
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Phone *</label>
                    <input type="tel" pattern="[0-9]{10}" required>
                </div>
                <div>
                    <label>Date of Birth *</label>
                    <input type="date" required>
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Course *</label>
                    <select required>
                        <option value="">Select</option>
                        <option>B.Tech CS</option>
                        <option>B.Tech AI</option>
                        <option>B.Sc Maths</option>
                    </select>
                </div>
                <div>
                    <label>10th % *</label>
                    <input type="number" min="0" max="100" step="0.1" required>
                </div>
            </div>
            <div>
                <label>Address *</label>
                <textarea class="full" required></textarea>
            </div>
            <div style="margin:20px 0">
                <label>Gender *</label>
                <input type="radio" name="gender" value="male" id="male" required><label for="male">Male</label>
                <input type="radio" name="gender" value="female" id="female" required><label for="female">Female</label>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU Event Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f7; margin: 0; padding: 20px; }
        .portal-header { background-color: #e0f2f1; color: #00796b; padding: 10px 20px; border-bottom: 2px solid #b2dfdb; font-weight: bold; margin-bottom: 20px; }
        .main-container { background: white; padding: 30px; border: 1px solid #ced4da; border-radius: 4px; max-width: 900px; margin: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .form-group { display: flex; align-items: center; }
        label { width: 140px; font-weight: bold; font-size: 14px; color: #333; }
        input, select { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
        .btn-submit { background-color: #b2dfdb; color: #004d40; border: none; padding: 10px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; float: right; }
        .flash-messages { background-color: #d1ecf1; color: #0c5460; padding: 10px; margin-bottom: 20px; border-left: 5px solid #17a2b8; }
    </style>
</head>
<body>
    <div class="portal-header">Event Registration Portal</div>
    <div class="main-container">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-messages">{% for message in messages %}<span>{{ message }}</span>{% endfor %}</div>
          {% endif %}
        {% endwith %}
        <form action="/register" method="POST">
            <div class="form-grid">
                <div class="form-group"><label>Full Name*</label><input type="text" name="full_name" required></div>
                <div class="form-group"><label>Student ID*</label><input type="text" name="student_id" required></div>
                <div class="form-group"><label>Event Type*</label>
                    <select name="event_name">
                        <option value="Tech Fest">Tech Fest</option>
                        <option value="Cultural Event">Cultural Event</option>
                        <option value="Workshop">Workshop</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit">Submit</button>
            <div style="clear: both;"></div>
        </form>
    </div>
    <script>
        setTimeout(function() {
            var msg = document.querySelector('.flash-messages');
            if (msg) msg.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
